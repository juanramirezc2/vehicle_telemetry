services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: qualitara
      POSTGRES_USER: qualitara
      POSTGRES_PASSWORD: qualitara
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualitara -d qualitara"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
