[alembic]
script_location = backend/alembic
prepend_sys_path = .
path_separator = os
# TODO: switch back to localhost when the local Postgres port conflict is removed.
sqlalchemy.url = postgresql+asyncpg://qualitara:qualitara@192.168.97.2:5432/qualitara

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
